{% extends "base.html" %}
{% block title %}{% if object %}Edit zone{% else %}Add zone{% endif %}{% endblock %}
{% block content %}
  <h1>{% if object %}Edit zone{% else %}Add zone{% endif %}</h1>
  <div class="card" style="max-width:480px;">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Save</button>
      <a href="{% url 'zone-list' %}" class="btn secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
