{% extends "base.html" %}
{% block title %}Add reading{% endblock %}
{% block content %}
  <h1>Add environmental reading</h1>
  <div class="card" style="max-width:480px;">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Save</button>
      <a href="{% url 'reading-list' %}" class="btn secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
